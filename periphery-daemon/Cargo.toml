[package]
name = "periphery-daemon"
version = "0.1.0"
edition = "2021"
description = "Peripheral shrinking windows for Hyprland/Omarchy. Listens to Hyprland socket2 events and continuously resizes dragged windows past the screen edge."
license = "MIT"
authors = ["Ex8-ca"]

[[bin]]
name = "periphery-daemon"
path = "src/main.rs"

[dependencies]
# Linux-only; we touch unix sockets, pids, and Hyprland env vars
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"